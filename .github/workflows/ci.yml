name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -v

  prometheus-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check rules syntax
        run: >
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p:ro"
          prom/prometheus:v2.54.1 check rules /p/rules/slo.rules.yml /p/rules/sitewatch.rules.yml
          /p/rules/remediation.rules.yml

      - name: Check prometheus + alertmanager config
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p:ro" \
            prom/prometheus:v2.54.1 check config /p/prometheus.yml --syntax-only
          docker run --rm --entrypoint amtool -v "$PWD/deploy/alertmanager:/a:ro" \
            prom/alertmanager:v0.27.0 check-config /a/alertmanager.yml

      - name: Alert unit tests
        run: >
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p:ro" -w /p/tests
          prom/prometheus:v2.54.1 test rules slo_test.yml
