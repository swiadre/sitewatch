name: Probe

# runs the prober from GitHub's servers, so the sites are monitored 24/7 even when my
# laptop is off. results are appended to the `data` branch (one JSON line per site per run)
on:
  schedule:
    - cron: "*/5 * * * *"   # best effort, GitHub sometimes runs it late or skips it
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Probe all sites once
        run: |
          mkdir -p data-branch/data
          python -m prober --json --region github-actions | tee -a "data-branch/data/$(date -u +%Y-%m).jsonl"

      - name: Telegram alert if a site went down / came back
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m statuspage.alert --data data-branch/data

      - name: Save results to the data branch
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "probe $(date -u +%Y-%m-%dT%H:%MZ)"
          # another run could have pushed in the meantime
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
