name: Probe

# runs the prober from GitHub's servers, so the sites are monitored 24/7 even when my
# laptop is off. results are appended to the `data` branch (one JSON line per site per run)
on:
  schedule:
    # best effort: GitHub delays or skips scheduled runs a lot (esp. at :00), offset helps a bit
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test Telegram message"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # to start the status page build

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Probe all sites once
        run: |
          mkdir -p data-branch/data
          python -m prober --json --region github-actions | tee -a "data-branch/data/$(date -u +%Y-%m).jsonl"

      - name: Telegram alert if a site went down / came back
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m statuspage.alert --data data-branch/data ${{ inputs.test_alert && '--test' || '' }}

      - name: Save results to the data branch
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "probe $(date -u +%Y-%m-%dT%H:%MZ)"
          # another run could have pushed in the meantime
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1

      - name: Rebuild the status page every ~30 min
        # github skips a lot of scheduled runs, so the probe (started from cron-job.org,
        # see README) also kicks off the status page build twice an hour
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          minute=$(date -u +%M)
          if [ $((10#$minute % 30)) -lt 5 ]; then gh workflow run status-page.yml --ref main; fi
