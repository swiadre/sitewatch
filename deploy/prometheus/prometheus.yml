global:
  scrape_interval: 15s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: sitewatch-prober
    scrape_interval: 5s   # demo app is probed every 5s, so scrape at least that often
    static_configs:
      - targets: ["prober:8000"]

  - job_name: remediator
    static_configs:
      - targets: ["remediator:9000"]

  - job_name: demo-app
    scrape_interval: 5s
    static_configs:
      - targets: ["sitewatch-demo:8080"]
        labels:
          site: demo

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
