# promtool unit tests for the SLO alerts
# run: promtool test rules deploy/prometheus/tests/slo_test.yml
rule_files:
  - ../rules/slo.rules.yml
  - ../rules/sitewatch.rules.yml

evaluation_interval: 30s

tests:
  # 1) one random failed probe should NOT wake anybody up
  #    (needs 3 days of history - with only ~1h of data the 6h window has very few
  #    probes and even 1 failure looks like a big error ratio, see slo/README.md)
  - interval: 30s
    input_series:
      - series: 'probes_total{site="kuponradar",result="success"}'
        values: '0+1x8700'
      - series: 'probes_total{site="kuponradar",result="failure"}'
        values: '0x8640 1x60'
      - series: 'up{job="sitewatch-prober"}'
        values: '1x8700'
    alert_rule_test:
      - eval_time: 72h10m
        alertname: ErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 72h10m
        alertname: ErrorBudgetBurnSlow
        exp_alerts: []

  # 2) site completely down for 10 minutes -> fast burn page
  - interval: 30s
    input_series:
      - series: 'probes_total{site="kuponradar",result="success"}'
        values: '0+1x100 100x20'
      - series: 'probes_total{site="kuponradar",result="failure"}'
        values: '0x100 1+1x20'
      - series: 'up{job="sitewatch-prober"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 50m
        alertname: ErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 60m
        alertname: ErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: page
              site: kuponradar
              slo: availability
            exp_annotations:
              summary: "kuponradar: availability SLO is burning error budget too fast"
              description: "error ratio 16.67%, objective 99.900%"

  # 3) small but constant error rate (1 failed probe every 200 = 0.5%)
  #    burns budget 5x faster than allowed -> ticket, but not a page (page needs 6x)
  - interval: 30s
    input_series:
      - series: 'probes_total{site="kuponradar",result="success"}'
        values: '0+1x3300'
      - series: 'probes_total{site="kuponradar",result="failure"}'
        values: '0x199 1x199 2x199 3x199 4x199 5x199 6x199 7x199 8x199 9x199 10x199 11x199 12x199 13x199 14x199 15x199 16x199'
      - series: 'up{job="sitewatch-prober"}'
        values: '1x3300'
    alert_rule_test:
      - eval_time: 1560m
        alertname: ErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 1560m
        alertname: ErrorBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              severity: ticket
              site: kuponradar
              slo: availability
            exp_annotations:
              summary: "kuponradar: availability SLO is burning error budget too fast"
              description: "error ratio 0.4838%, objective 99.900%"

  # 4) prober itself is dead
  - interval: 30s
    input_series:
      - series: 'up{job="sitewatch-prober"}'
        values: '1x10 0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ProberDown
        exp_alerts:
          - exp_labels:
              severity: page
              job: sitewatch-prober
            exp_annotations:
              summary: sitewatch prober is down, sites are NOT being monitored

  # 5) cert about to expire
  - interval: 1m
    input_series:
      - series: 'tls_cert_days_left{site="kuponradar"}'
        values: '10x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: TLSCertExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: ticket
              site: kuponradar
            exp_annotations:
              summary: "kuponradar: TLS certificate expires in 10 days"

  # 6) one region can't reach the site, the other can -> network problem ticket
  - interval: 30s
    input_series:
      - series: 'probe_success{site="kuponradar",region="main"}'
        values: '1x20'
      - series: 'probe_success{site="kuponradar",region="us-central1"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: SiteUnreachableFromOneRegion
        exp_alerts:
          - exp_labels:
              severity: ticket
              site: kuponradar
              region: us-central1
            exp_annotations:
              summary: "kuponradar fails only from us-central1, other regions are fine - network problem?"
      - eval_time: 8m
        alertname: SiteDownFromAllRegions
        exp_alerts: []

  # 7) all regions fail -> real outage, page
  - interval: 30s
    input_series:
      - series: 'probe_success{site="kuponradar",region="main"}'
        values: '0x20'
      - series: 'probe_success{site="kuponradar",region="us-central1"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: SiteDownFromAllRegions
        exp_alerts:
          - exp_labels:
              severity: page
              site: kuponradar
            exp_annotations:
              summary: "kuponradar is down from every region"
      - eval_time: 5m
        alertname: SiteUnreachableFromOneRegion
        exp_alerts: []

  # 8) regression test for postmortems/2026-10-19-false-page-after-laptop-wake.md
  #    50 min gap in the data (laptop asleep), then 1 failed probe right after wake.
  #    the 1h window only has ~30 probes, so 1 failure = 3% error rate = 23x burn rate.
  #    before the min-data guard this paged. now it must not
  - interval: 30s
    input_series:
      - series: 'probes_total{site="kuponradar",result="success"}'
        values: '0+1x20 _x100 21+1x8 29x2 30+1x10'
      - series: 'probes_total{site="kuponradar",result="failure"}'
        values: '0x20 _x100 0x8 1x13'
      - series: 'up{job="sitewatch-prober"}'
        values: '1x20 _x100 1x21'
    alert_rule_test:
      - eval_time: 70m
        alertname: ErrorBudgetBurnFast
        exp_alerts: []
