# prober config used inside docker compose = prober/config.yaml + the demo app
interval_seconds: 30
timeout_seconds: 10

sites:
  - name: kuponradar
    url: https://kuponradar.pl
    expected_text: KuponRadar

  - name: taxnieruchomosci
    url: https://taxnieruchomosci.pl
    expected_text: Tax Nieruchomości

  - name: alstrategika
    url: https://www.alstrategika.com
    expected_text: Aleksandra

  # local app that gets broken on purpose (chaos tests), probed more often
  - name: demo
    url: http://sitewatch-demo:8080/
    expected_text: sitewatch demo app
    interval_seconds: 5
