name: sitewatch

services:
  prober:
    # CI pushes this image, locally `docker compose up --build` builds it
    image: ghcr.io/swiadre/sitewatch-prober:${IMAGE_TAG:-latest}
    build: ..
    restart: unless-stopped
    command: ["python", "-u", "-m", "prober", "--metrics-port", "8000", "--config", "/etc/sitewatch/prober.yaml"]
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - ./prober.yaml:/etc/sitewatch/prober.yaml:ro
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=45d   # need >30d for the SLO window
      - --web.enable-lifecycle              # allows POST /-/reload
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"

  remediator:
    image: ghcr.io/swiadre/sitewatch-remediator:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: remediation/Dockerfile
    restart: unless-stopped
    environment:
      - TZ=Europe/Warsaw
      - DEMO_NETWORK=sitewatch_default
      - GRAFANA_URL=${GRAFANA_URL:-http://localhost:3000}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - MAX_ACTIONS_PER_HOUR=${MAX_ACTIONS_PER_HOUR:-3}
      - ACTION_COOLDOWN_SECONDS=${ACTION_COOLDOWN_SECONDS:-120}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - remediator-data:/data
    ports:
      - "9000:9000"

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
  remediator-data:
