# build with (the config files live in ../deploy, kustomize needs the flag to read them):
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sitewatch

resources:
  - namespace.yaml
  - prober.yaml
  - demo.yaml
  - prometheus.yaml
  - alertmanager.yaml
  - grafana.yaml
  - remediator.yaml

# same config files as docker compose, service names are the same too
configMapGenerator:
  - name: prober-config
    files: [prober.yaml=../deploy/prober.yaml]
  - name: prometheus-config
    files: [prometheus.yml=../deploy/prometheus/prometheus.yml]
  - name: prometheus-rules
    files:
      - ../deploy/prometheus/rules/slo.rules.yml
      - ../deploy/prometheus/rules/sitewatch.rules.yml
      - ../deploy/prometheus/rules/remediation.rules.yml
  - name: alertmanager-config
    files: [../deploy/alertmanager/alertmanager.yml]
  - name: grafana-datasources
    files: [../deploy/grafana/provisioning/datasources/prometheus.yml]
  - name: grafana-dashboard-provider
    files: [../deploy/grafana/provisioning/dashboards/dashboards.yml]
  - name: grafana-dashboards
    files: [../deploy/grafana/dashboards/sitewatch.json]
